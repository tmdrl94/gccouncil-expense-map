<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>업종 재분류 도구 (1회용) — 과천시의회 업무추진비</title>
<meta name="robots" content="noindex, nofollow" />
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 24px; background:#f9f9f7; color:#0b0b0b; }
  h1 { font-size: 18px; }
  p.desc { color:#52514e; font-size: 13px; line-height:1.6; }
  #progress { font-size: 14px; margin: 12px 0; font-variant-numeric: tabular-nums; }
  button { padding: 8px 14px; font-size: 13px; border-radius: 6px; border: 1px solid #c3c2b7; background:#fff; cursor:pointer; margin-right:8px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { border-collapse: collapse; width:100%; font-size:12px; margin-top:16px; }
  th, td { border:1px solid #e1e0d9; padding:4px 6px; text-align:left; }
  th { background:#eee; position: sticky; top:0; }
  .fail { background:#fde8e8; }
  textarea { width:100%; height:200px; font-family: monospace; font-size:11px; margin-top:12px; }
</style>
</head>
<body>
  <h1>업종 재분류 도구 (관리자 전용, 1회 실행용)</h1>
  <p class="desc">
    <code>/data/places.csv</code>의 식당·카페 목록을 카카오 키워드 장소검색으로 다시 조회해서
    실제 카카오맵에 등록된 <b>category_name</b>(업종) 원문을 가져옵니다. 실행 후 아래 텍스트박스 내용을
    복사해서 넘겨주시면 업종 매핑에 반영합니다.
  </p>
  <button id="startBtn">조회 시작</button>
  <button id="downloadBtn" disabled>CSV 다운로드</button>
  <div id="progress"></div>
  <table id="resultTable">
    <thead><tr><th>#</th><th>place</th><th>status</th><th>category_name(원문)</th><th>place_url</th></tr></thead>
    <tbody></tbody>
  </table>
  <textarea id="output" readonly placeholder="완료 후 이 곳에 최종 CSV 텍스트가 표시됩니다."></textarea>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=__KAKAO_JS_KEY__&libraries=services&autoload=false"></script>
<script src="recategorize.js"></script>
</body>
</html>
